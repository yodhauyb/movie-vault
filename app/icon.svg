<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/> <!-- Slate 900 -->
      <stop offset="100%" stop-color="#020617"/> <!-- Slate 950 -->
    </linearGradient>
    
    <!-- Neon Movie Vault Gradient (Indigo to Rose) -->
    <linearGradient id="mvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/> <!-- Indigo 500 -->
      <stop offset="100%" stop-color="#F43F5E"/> <!-- Rose 500 -->
    </linearGradient>
    
    <!-- White Glow for Play Button -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Box (Rounded Edges) -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  
  <!-- Outer glowing border -->
  <rect width="480" height="480" x="16" y="16" rx="104" fill="none" stroke="url(#mvGrad)" stroke-width="8" opacity="0.3" />

  <!-- The Letter 'M' (Stylized) -->
  <path d="M 130 380 L 130 160 L 256 280 L 382 160 L 382 380" fill="none" stroke="url(#mvGrad)" stroke-width="48" stroke-linejoin="round" stroke-linecap="round"/>
  
  <!-- The Letter 'V' (which forms a Play Button in the center) -->
  <path d="M 216 260 L 296 260 L 256 330 Z" fill="#FFFFFF" filter="url(#glow)"/>
  
  <!-- Top Vault Lock Dots -->
  <circle cx="200" cy="130" r="12" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="312" cy="130" r="12" fill="#FFFFFF" opacity="0.5"/>
</svg>